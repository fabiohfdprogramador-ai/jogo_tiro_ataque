<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia dos bonecos</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", Arial, sans-serif; color: #fff; }
  canvas { display: block; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px; border: 1px solid #555; background: rgba(20,22,26,.85); color: #fff; cursor: pointer; }
  #bar button.sel { border-color: #e8c88a; color: #e8c88a; }
  #info { position: fixed; right: 12px; top: 12px; font-size: 13px; background: rgba(20,22,26,.7); padding: 6px 10px; border-radius: 6px; }
  #dica { position: fixed; left: 12px; bottom: 12px; font-size: 13px; opacity: .75; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar"></div>
<div id="info"></div>
<div id="dica">Arraste para girar · roda do mouse para aproximar</div>
<script type="module" src="/bonecos.js"></script>
</body>
</html>
